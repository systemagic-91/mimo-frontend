name: Frontend CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint e typecheck
        run: npm run check
      - name: Testes unitários
        run: npm test

  e2e:
    name: E2E (Chromium, Firefox e WebKit)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Backend de teste: o .jar do mimo-backend (repositório público), com PostgreSQL descartável no Docker,
      # iniciado pelo e2e/global-setup.ts, como na máquina de quem desenvolve.
      - uses: actions/checkout@v4
        with:
          repository: systemagic-91/mimo-backend
          path: mimo-backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar o .jar do backend
        working-directory: mimo-backend
        run: ./gradlew bootJar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar os navegadores do Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      - name: E2E
        env:
          E2E_BACKEND_DIR: mimo-backend
        run: npm run test:e2e
      - name: Publicar o relatório e o log do backend
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
